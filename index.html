<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo">
            <img src="assets/logo.png.jpg" alt="Logo" />
        </div>
        <h1>Cloud Computing Dashboard</h1>
        <p>Track your cloud resources and services</p>
    </header>

    <!-- Main Content Section -->
    <main>
        <div class="resources">
            <h2>Your Cloud Resources</h2>
            <div class="resource-card">
                <h3>Compute Resources</h3>
                <p id="compute">Loading...</p>
            </div>
            <div class="resource-card">
                <h3>Storage Resources</h3>
                <p id="storage">Loading...</p>
            </div>
            <div class="resource-card">
                <h3>Network Resources</h3>
                <p id="network">Loading...</p>
            </div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>Cloud Dashboard - Practice project for cloud computing</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
